suite = "v2_semantic_retrieval_ablation"
version = 1

[[case]]
id = "gen_list_append_nil"
path = "cases/01_gen_list_append_nil.lean"
mode = "generation"
max_rounds = 4
purpose = "Retrieve a polymorphic right-append identity"
expected_declarations = ["List.append_nil"]
reference_proof = "by\n  exact List.append_nil xs"

[[case]]
id = "gen_list_nil_append"
path = "cases/02_gen_list_nil_append.lean"
mode = "generation"
max_rounds = 4
purpose = "Distinguish the left-append identity from its converse"
expected_declarations = ["List.nil_append"]
reference_proof = "by\n  exact List.nil_append xs"

